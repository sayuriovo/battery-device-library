name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 只允许改设备数据 / Only device data may change
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          bad=$(echo "$changed" | grep -vE '^(devices/|captures/|library\.json$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::这个 PR 改了设备数据以外的文件 / This PR changes files outside device data:"
            echo "$bad"
            exit 1
          fi

      - name: 检查设备库 / Check library
        run: python tools/check_library.py
